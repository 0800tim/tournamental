<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
  <title id="t">Rugby World Cup 2027, Australia</title>
  <desc id="d">Original Tournamental illustration: a gold and green rugby ball under the Southern Cross, goal posts on a floodlit night pitch.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a16"/>
      <stop offset="0.6" stop-color="#101c3a"/>
      <stop offset="1" stop-color="#16302f"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6a40"/>
      <stop offset="1" stop-color="#0b2f20"/>
    </linearGradient>
    <linearGradient id="ball" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffe59a"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#a8761a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c14e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="ballclip"><ellipse cx="0" cy="0" rx="300" ry="180"/></clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>

  <g fill="#ffffff" opacity="0.5">
    <circle cx="90" cy="120" r="1.6"/><circle cx="240" cy="60" r="1.2"/><circle cx="400" cy="170" r="1.4"/>
    <circle cx="560" cy="50" r="1.1"/><circle cx="700" cy="140" r="1.5"/><circle cx="820" cy="40" r="1.2"/>
    <circle cx="1120" cy="90" r="1.4"/><circle cx="1040" cy="330" r="1.1"/><circle cx="160" cy="300" r="1.2"/>
    <circle cx="330" cy="380" r="1.0"/><circle cx="60" cy="470" r="1.1"/><circle cx="1160" cy="430" r="1.3"/>
    <circle cx="640" cy="300" r="1.0"/><circle cx="470" cy="260" r="1.2"/><circle cx="880" cy="250" r="1.0"/>
  </g>

  <!-- Southern Cross -->
  <g>
    <circle cx="960" cy="290" r="26" fill="url(#star)"/><circle cx="960" cy="290" r="7" fill="#fff"/>
    <circle cx="960" cy="95" r="24" fill="url(#star)"/><circle cx="960" cy="95" r="6.5" fill="#fff"/>
    <circle cx="845" cy="195" r="26" fill="url(#star)"/><circle cx="845" cy="195" r="7" fill="#fff"/>
    <circle cx="1090" cy="180" r="24" fill="url(#star)"/><circle cx="1090" cy="180" r="6.5" fill="#fff"/>
    <circle cx="1010" cy="228" r="14" fill="url(#star)"/><circle cx="1010" cy="228" r="3.5" fill="#fff"/>
  </g>

  <!-- floodlight glow on the horizon -->
  <ellipse cx="600" cy="560" rx="760" ry="130" fill="url(#glow)" filter="url(#soft)"/>

  <!-- pitch -->
  <path d="M0 570 Q600 500 1200 570 L1200 800 L0 800 Z" fill="url(#pitch)"/>
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="3" fill="none">
    <path d="M0 630 Q600 585 1200 630"/>
    <path d="M0 705 Q600 672 1200 705"/>
    <path d="M0 785 Q600 765 1200 785"/>
    <path d="M330 570 L120 800"/>
    <path d="M870 570 L1080 800"/>
  </g>

  <!-- goal posts -->
  <g stroke="#f7f3e8" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M980 575 L980 215"/>
    <path d="M1130 575 L1130 215"/>
    <path d="M980 420 L1130 420"/>
  </g>

  <!-- ball shadow -->
  <ellipse cx="500" cy="640" rx="300" ry="42" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <!-- rugby ball -->
  <g transform="translate(480 450) rotate(-24)">
    <ellipse cx="0" cy="0" rx="300" ry="180" fill="url(#ball)"/>
    <g clip-path="url(#ballclip)">
      <path d="M-300 0 Q0 -48 300 0" stroke="#8c5f12" stroke-width="5" fill="none" opacity="0.55"/>
      <path d="M-300 0 Q0 48 300 0" stroke="#8c5f12" stroke-width="5" fill="none" opacity="0.55"/>
      <path d="M-110 -180 L-70 180" stroke="#1f7a4d" stroke-width="26" opacity="0.9"/>
      <path d="M110 -180 L150 180" stroke="#1f7a4d" stroke-width="26" opacity="0.9"/>
      <ellipse cx="-90" cy="-85" rx="140" ry="58" fill="#fff" opacity="0.16"/>
    </g>
    <path d="M-130 -10 L130 -10" stroke="#f7f3e8" stroke-width="9" stroke-linecap="round"/>
    <g stroke="#f7f3e8" stroke-width="8" stroke-linecap="round">
      <path d="M-96 -30 L-96 12"/><path d="M-48 -30 L-48 12"/><path d="M0 -30 L0 12"/><path d="M48 -30 L48 12"/><path d="M96 -30 L96 12"/>
    </g>
    <ellipse cx="0" cy="0" rx="300" ry="180" fill="none" stroke="#5a3a08" stroke-width="4" opacity="0.5"/>
  </g>
</svg>
