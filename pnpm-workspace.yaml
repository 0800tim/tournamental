packages:
  - "!apps/billion-bot"
  - 'apps/*'
  - 'packages/*'
  - 'packages/plugins/*'
  - 'examples/*'
  - 'tools'
  - 'infra/deploy'
allowBuilds:
  '@swc/core': true
  esbuild: true
  sharp: true
  better-sqlite3: true
  protobufjs: true
  unrs-resolver: true
blockExoticSubdeps: false
onlyBuiltDependencies:
  - better-sqlite3
overrides:
  devalue: ^5.8.1
  fast-uri: ^3.1.2
  music-metadata: ^11.12.3
  postcss: ^8.5.10
  qs: ^6.15.2
  tar: ^7.5.11
  ws: ^8.20.1
  vitest>vite: ^6.4.3
  '@vitest/mocker>vite': ^6.4.3
